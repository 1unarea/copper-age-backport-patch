plugins {
    id 'java'
    id 'com.modrinth.minotaur' version '2.9.0'
}

group = 'com.github.lunarea'
version = '0.1.4'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.21.0.246'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.guava:failureaccess:1.0.2'
    testImplementation 'mezz.jei:jei-1.21.1-common-api:19.21.0.246'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    dependsOn tasks.named('deployMod')
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jar {
    archiveBaseName = 'copper_age_patch-neoforge-1.21.1'
    archiveVersion = project.version.toString()
    exclude 'fabric.mod.json'
    exclude 'com/github/lunarea/copperagepatch/fabric/**'
    manifest {
        attributes([
            'Specification-Title'     : 'copper_age_patch',
            'Specification-Vendor'    : 'lunarea',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'copper_age_patch-neoforge',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'lunarea',
            'Implementation-Timestamp': new java.util.Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('fabricJar', Jar) {
    dependsOn tasks.named('classes')
    archiveBaseName = 'copper_age_patch-fabric-1.21.1'
    archiveVersion = project.version.toString()
    from sourceSets.main.output
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'com/github/lunarea/copperagepatch/CopperAgePatch.class'
    manifest {
        attributes([
            'Specification-Title'     : 'copper_age_patch',
            'Specification-Vendor'    : 'lunarea',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'copper_age_patch-fabric',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'lunarea',
            'Implementation-Timestamp': new java.util.Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def defaultFabricProfileDir = file('/home/lunarea/.var/app/com.modrinth.ModrinthApp/data/ModrinthApp/profiles/cabp fabric/mods')
def defaultNeoForgeProfileDir = file('/home/lunarea/.var/app/com.modrinth.ModrinthApp/data/ModrinthApp/profiles/cabp neoforge/mods')

tasks.register('deployMod') {
    dependsOn tasks.named('jar'), tasks.named('fabricJar')
    doLast {
        def libsDir = layout.buildDirectory.dir('libs').get().asFile
        def fabricJar = new File(libsDir, "copper_age_patch-fabric-1.21.1-${project.version}.jar")
        def neoforgeJar = new File(libsDir, "copper_age_patch-neoforge-1.21.1-${project.version}.jar")

        if (defaultFabricProfileDir.exists() && fabricJar.exists()) {
            defaultFabricProfileDir.listFiles()?.each { f ->
                if (f.name.startsWith('copper_age_patch-fabric-') && f.name != fabricJar.name) {
                    println "Cleaning up stale fabric mod jar: ${f.name}"
                    f.delete()
                }
            }
            try {
                new File(defaultFabricProfileDir, fabricJar.name).delete()
            } catch (Throwable ignored) {}
            ant.copy(file: fabricJar, todir: defaultFabricProfileDir, overwrite: true)
            println "Deployed ${fabricJar.name} to ${defaultFabricProfileDir}"
        }

        if (defaultNeoForgeProfileDir.exists() && neoforgeJar.exists()) {
            defaultNeoForgeProfileDir.listFiles()?.each { f ->
                if (f.name.startsWith('copper_age_patch-neoforge-') && f.name != neoforgeJar.name) {
                    println "Cleaning up stale neoforge mod jar: ${f.name}"
                    f.delete()
                }
            }
            try {
                new File(defaultNeoForgeProfileDir, neoforgeJar.name).delete()
            } catch (Throwable ignored) {}
            ant.copy(file: neoforgeJar, todir: defaultNeoForgeProfileDir, overwrite: true)
            println "Deployed ${neoforgeJar.name} to ${defaultNeoForgeProfileDir}"
        }
    }
}

tasks.named('jar') {
    finalizedBy 'deployMod'
}

tasks.named('fabricJar') {
    finalizedBy 'deployMod'
}

tasks.named('assemble') {
    dependsOn tasks.named('fabricJar')
    finalizedBy 'deployMod'
}

def resolveChangelog = {
    def changelogFile = file('CHANGELOG.md')
    if (changelogFile.exists()) {
        def text = changelogFile.text
        def match = text =~ /(?ms)^##\s+\[?${project.version}\]?[^\n]*\n(.*?)(?=^##\s|\Z)/
        if (match.find()) {
            return match.group(1).trim()
        }
    }
    return "v${project.version}"
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: (project.findProperty("modrinthToken") ?: "")
    projectId = "4Gz003Sy"
    versionNumber = project.version.toString()
    versionName = "v${project.version}"
    versionType = "beta"
    uploadFile = tasks.jar
    additionalFiles = [tasks.fabricJar]
    gameVersions = ["1.21.1"]
    loaders = ["neoforge", "fabric"]
    changelog = resolveChangelog()
    dependencies {
        required.project "a1llHwl4"  // Copper Age Backport
        optional.project "uXeEiQk1"  // Tool Trims
    }
}

tasks.register('publishGithub', Exec) {
    group = 'publishing'
    description = 'Publishes release to GitHub Releases'
    dependsOn tasks.named('assemble')
    commandLine 'python3', 'scripts/publish.py', '--github'
}

tasks.register('publishModrinth', Exec) {
    group = 'publishing'
    description = 'Publishes both NeoForge and Fabric jars to Modrinth'
    dependsOn tasks.named('assemble')
    commandLine 'python3', 'scripts/publish.py', '--modrinth'
}

tasks.register('publishCurseforge', Exec) {
    group = 'publishing'
    description = 'Publishes both NeoForge and Fabric jars to CurseForge'
    dependsOn tasks.named('assemble')
    commandLine 'python3', 'scripts/publish.py', '--curseforge'
}

tasks.register('publishAll', Exec) {
    group = 'publishing'
    description = 'Publishes release to GitHub, Modrinth, and CurseForge'
    dependsOn tasks.named('assemble')
    commandLine 'python3', 'scripts/publish.py', '--all'
}

