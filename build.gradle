plugins {
    id 'java'
}

group = 'com.github.lunarea'
version = '0.1.2'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.guava:failureaccess:1.0.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test') {
    dependsOn tasks.named('deployMod')
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

jar {
    archiveBaseName = 'copper_age_patch-neoforge-1.21.1'
    archiveVersion = project.version.toString()
    exclude 'fabric.mod.json'
    exclude 'com/github/lunarea/copperagepatch/fabric/**'
    manifest {
        attributes([
            'Specification-Title'     : 'copper_age_patch',
            'Specification-Vendor'    : 'lunarea',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'copper_age_patch-neoforge',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'lunarea',
            'Implementation-Timestamp': new java.util.Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('fabricJar', Jar) {
    dependsOn tasks.named('classes')
    archiveBaseName = 'copper_age_patch-fabric-1.21.1'
    archiveVersion = project.version.toString()
    from sourceSets.main.output
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'com/github/lunarea/copperagepatch/CopperAgePatch.class'
    manifest {
        attributes([
            'Specification-Title'     : 'copper_age_patch',
            'Specification-Vendor'    : 'lunarea',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'copper_age_patch-fabric',
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'lunarea',
            'Implementation-Timestamp': new java.util.Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def defaultFabricProfileDir = file('/home/lunarea/.var/app/com.modrinth.ModrinthApp/data/ModrinthApp/profiles/cabp fabric/mods')
def targetModsDir = project.findProperty('modsDir') ? file(project.property('modsDir')) :
                    (System.getenv('MODS_DIR') ? file(System.getenv('MODS_DIR')) :
                    (defaultFabricProfileDir.exists() ? defaultFabricProfileDir : null))

tasks.register('deployMod', Copy) {
    dependsOn tasks.named('jar'), tasks.named('fabricJar')
    doFirst {
        if (targetModsDir != null && targetModsDir.exists()) {
            def currentJarName = "copper_age_patch-fabric-1.21.1-${project.version}.jar".toString()
            targetModsDir.listFiles()?.each { f ->
                if (f.name.startsWith('copper_age_patch-fabric-') && f.name != currentJarName) {
                    println "Cleaning up stale mod jar: ${f.name}"
                    f.delete()
                }
            }
        }
    }
    from(layout.buildDirectory.dir('libs')) {
        if (targetModsDir != null && targetModsDir.getAbsolutePath().contains('cabp fabric')) {
            include '*-fabric-*.jar'
        }
    }
    into targetModsDir ?: layout.buildDirectory.dir('deployed')
    onlyIf {
        targetModsDir != null && targetModsDir.exists()
    }
}

tasks.named('jar') {
    finalizedBy 'deployMod'
}

tasks.named('fabricJar') {
    finalizedBy 'deployMod'
}

tasks.named('assemble') {
    dependsOn tasks.named('fabricJar')
    finalizedBy 'deployMod'
}
